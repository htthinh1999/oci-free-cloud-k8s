apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: wattvn-api
  namespace: wattvn-api
spec:
  interval: 5m
  type: oci
  url: oci://ghcr.io/htthinh1999/charts
  secretRef:
    name: ghcr-pull-secret
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wattvn-api
  namespace: wattvn-api
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: wattvn-api
      version: '0.2.3' # bumped manually when Chart.yaml's version changes
      sourceRef:
        kind: HelmRepository
        name: wattvn-api
      interval: 5m
  releaseName: wattvn-api
  values:
    image:
      # PINNED during the wattvn-api -> wattvn migration (see
      # docs/superpowers/plans/2026-07-27-wattvn-rename-and-frontend-deploy.md):
      # tag 16 requires Cors:AllowedOrigin, which chart 0.2.3 (pinned above)
      # never templated into an env var, so it crash-loops on startup with
      # "Cors:AllowedOrigin is not configured." Marker comment intentionally
      # removed so ImageUpdateAutomation no longer touches this value - the
      # new gitops/core/wattvn/ release (chart 0.3.0) is the one that gets
      # to track new image tags going forward.
      tag: '15'
