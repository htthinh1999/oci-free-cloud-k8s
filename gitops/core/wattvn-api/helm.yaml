apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: wattvn-api
  namespace: wattvn-api
spec:
  interval: 5m
  type: oci
  url: oci://ghcr.io/htthinh1999/charts
  secretRef:
    name: ghcr-pull-secret
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wattvn-api
  namespace: wattvn-api
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: wattvn-api
      version: '0.2.3' # bumped manually when Chart.yaml's version changes
      sourceRef:
        kind: HelmRepository
        name: wattvn-api
      interval: 5m
  releaseName: wattvn-api
  values:
    image:
      # Auto-updated by the wattvn-api ImageUpdateAutomation - do not bump by hand.
      tag: '10' # {"$imagepolicy": "wattvn-api:wattvn-api:tag"}
