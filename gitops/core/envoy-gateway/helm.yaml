apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: envoy
spec:
  interval: 5m
  type: oci
  url: oci://docker.io/envoyproxy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gatweway
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: gateway-helm
      version: "1.7.2"
      sourceRef:
        kind: HelmRepository
        name: envoy
      interval: 5m
  releaseName: envoy-gateway
  values:
    deployment:
      envoyGateway:
        # No resources block previously - chart default (100m CPU / 256Mi
        # request, 1Gi limit) was unaccounted for, even though observed usage
        # is ~73Mi. Verified key path against the chart's values.tmpl.yaml
        # (deployment.envoyGateway.resources). Trimmed in line with every
        # other core component in this repo.
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 256Mi
