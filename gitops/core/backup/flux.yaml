apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup
  namespace: flux-system
spec:
  interval: 1h
  path: ./gitops/core/backup
  prune: true
  # the jobs live next to the data they back up, in namespaces owned by these components
  dependsOn:
    - name: external-secrets
    - name: wattvn-postgres
    - name: wattvn
    - name: teleport
  sourceRef:
    kind: GitRepository
    name: flux-system
