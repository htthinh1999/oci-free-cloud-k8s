apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8s-backup-s3
  namespace: wattvn-postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: k8s-backup-s3
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      # complete rclone remote "oci" as env vars, used via envFrom
      # bucket, user and key come from terraform/config/modules/backup
      data:
        RCLONE_CONFIG_OCI_TYPE: s3
        RCLONE_CONFIG_OCI_PROVIDER: Other
        RCLONE_CONFIG_OCI_ENDPOINT: https://axymtfsn7ozv.compat.objectstorage.ap-singapore-1.oraclecloud.com
        RCLONE_CONFIG_OCI_REGION: ap-singapore-1
        RCLONE_CONFIG_OCI_FORCE_PATH_STYLE: "true"
        # the key may only write objects, not create/inspect buckets
        RCLONE_CONFIG_OCI_NO_CHECK_BUCKET: "true"
        RCLONE_CONFIG_OCI_ACCESS_KEY_ID: "{{ .accessKeyId }}"
        RCLONE_CONFIG_OCI_SECRET_ACCESS_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: k8s-backup-s3-access-key-id
        version: CURRENT
        decodingStrategy: None
    - secretKey: secretAccessKey
      remoteRef:
        key: k8s-backup-s3-secret-access-key
        version: CURRENT
        decodingStrategy: None
---
