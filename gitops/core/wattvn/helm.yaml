apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: wattvn
  namespace: wattvn
spec:
  interval: 5m
  type: oci
  url: oci://ghcr.io/htthinh1999/charts
  secretRef:
    name: ghcr-pull-secret
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wattvn
  namespace: wattvn
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: wattvn
      version: '0.3.7' # bumped manually when Chart.yaml's version changes
      sourceRef:
        kind: HelmRepository
        name: wattvn
      interval: 5m
  releaseName: wattvn
  values:
    api:
      replicaCount: 1
      existingSecretName: wattvn-secrets
      image:
        # Auto-updated by the wattvn ImageUpdateAutomation - do not bump by hand.
        tag: '65' # {"$imagepolicy": "wattvn:wattvn-api:tag"}
      env:
        corsAllowedOrigin: "http://localhost:5173,https://wattvn.keycodemon.org"
        # Fallback EVN CPC proxy on the Raspberry Pi 5 (k3s-raspberry-pi-5-tailscale repo, apps/evn-proxy), used only
        # when the NUC's proxy (chart default evnBaseUrl, nuc/evn-proxy here) is unreachable. Raw Tailscale IP: the
        # wattvn-api pod has no MagicDNS.
        evnBackupBaseUrl: "http://100.106.85.105:30082"
        resendFromEmail: "WattVN Alerts <alerts@keycodemon.org>"
        webPushSubject: "mailto:alerts@keycodemon.org"
      dataProtection:
        persistence:
          # chart default is longhorn, which this cluster no longer runs
          storageClass: local-path
    web:
      image:
        # Auto-updated by the wattvn ImageUpdateAutomation - do not bump by hand.
        tag: '65' # {"$imagepolicy": "wattvn:wattvn-web:tag"}
