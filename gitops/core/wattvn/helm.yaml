apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: wattvn
  namespace: wattvn
spec:
  interval: 5m
  type: oci
  url: oci://ghcr.io/htthinh1999/charts
  secretRef:
    name: ghcr-pull-secret
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wattvn
  namespace: wattvn
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: wattvn
      version: '0.3.3' # bumped manually when Chart.yaml's version changes
      sourceRef:
        kind: HelmRepository
        name: wattvn
      interval: 5m
  releaseName: wattvn
  values:
    api:
      replicaCount: 1
      existingSecretName: wattvn-secrets
      image:
        # Auto-updated by the wattvn ImageUpdateAutomation - do not bump by hand.
        tag: '33' # {"$imagepolicy": "wattvn:wattvn-api:tag"}
      env:
        corsAllowedOrigin: "http://localhost:5173,https://wattvn.keycodemon.org"
    web:
      image:
        # Auto-updated by the wattvn ImageUpdateAutomation - do not bump by hand.
        tag: '34' # {"$imagepolicy": "wattvn:wattvn-web:tag"}
