apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wattvn-secrets
  namespace: wattvn
spec:
  refreshInterval: 3m
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: wattvn-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        ConnectionStrings__Postgres: "Host=wattvn-postgres-rw.wattvn-postgres.svc.cluster.local;Port=5432;Database=wattvn;Username=wattvn;Password={{ .pgPassword
          }}"
        Jwt__Secret: "{{ .jwtSecret }}"
        Internal__SyncSecret: "{{ .internalSyncSecret }}"
        Turnstile__SecretKey: "{{ .turnstileSecretKey }}"
        Resend__ApiKey: "{{ .resendApiKey }}"
        WebPush__PrivateKey: "{{ .webPushPrivateKey }}"
  data:
    - secretKey: pgPassword
      remoteRef:
        # SAME vault key as gitops/core/wattvn-postgres/secret.yaml - single
        # source of truth for the app-user password.
        key: wattvn-postgres-app-password
        version: CURRENT
        decodingStrategy: None
    - secretKey: jwtSecret
      remoteRef:
        key: wattvn-jwt-secret
        version: CURRENT
        decodingStrategy: None
    - secretKey: internalSyncSecret
      remoteRef:
        key: wattvn-internal-sync-secret
        version: CURRENT
        decodingStrategy: None
    - secretKey: turnstileSecretKey
      remoteRef:
        key: wattvn-turnstile-secret-key
        version: CURRENT
        decodingStrategy: None
    - secretKey: resendApiKey
      remoteRef:
        # Create this key manually in the OCI Vault console - wattvn-api's
        # Resend:ApiKey is optional (threshold-alert emails), so nothing
        # breaks until it exists; ExternalSecret sync just keeps failing
        # for this one key (existing keys/Secret contents are unaffected).
        key: wattvn-resend-api-key
        version: CURRENT
        decodingStrategy: None
    - secretKey: webPushPrivateKey
      remoteRef:
        # VAPID private key for device push notifications (base64url, from
        # `npx web-push generate-vapid-keys` - only the private key is needed,
        # wattvn-api derives the public key). Create it in the OCI Vault
        # console BEFORE merging this: until it exists the whole ExternalSecret
        # fails to refresh (the existing Secret is left as-is, so nothing breaks,
        # but no other key in it updates either).
        key: wattvn-webpush-private-key
        version: CURRENT
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: wattvn
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        # Serves two consumers: this chart's Deployment imagePullSecrets (for
        # kubelet pulling the private image) and helm.yaml's HelmRepository
        # secretRef (for Flux pulling the private chart) - both just need a
        # same-namespace dockerconfigjson Secret, so one suffices.
        .dockerconfigjson: |
          {{ printf `{"auths":{"ghcr.io":{"username":"htthinh1999","password":"%s","auth":"%s"}}}` .token (printf "htthinh1999:%s" .token | b64enc) }}
  data:
    - secretKey: token
      remoteRef:
        key: ghcr-pull-token
        version: CURRENT
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wattvn-tailscale-authkey
  namespace: wattvn
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: wattvn-tailscale-authkey
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        authkey: "{{ .authkey }}"
  data:
    - secretKey: authkey
      remoteRef:
        key: wattvn-tailscale-authkey
        version: CURRENT
        decodingStrategy: None
